<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CardNurture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
      }

      main {
        width: min(100%, 30rem);
        padding: 32px 24px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 20px 45px rgb(15 23 42 / 10%);
        text-align: center;
      }

      .mark {
        display: inline-grid;
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        place-items: center;
        border-radius: 16px;
        background: #0f172a;
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 5vw, 1.75rem);
        line-height: 1.2;
      }

      p {
        margin: 14px 0 0;
        color: #475569;
        font-size: 1rem;
        line-height: 1.55;
      }

      .hint {
        margin-top: 22px;
        padding: 14px;
        border-radius: 12px;
        background: #f1f5f9;
        color: #334155;
        font-size: 0.9rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="mark" aria-hidden="true">CN</div>
      <h1 id="title">CardNurture is ready to connect</h1>
      <p>
        This mobile shell loads the secure CardNurture web app. No app server or
        customer data is bundled into the native package.
      </p>
      <p class="hint">
        No hosted URL is configured. Set
        <code>CAPACITOR_SERVER_URL</code> to an HTTPS CardNurture URL, then sync
        the native project.
      </p>
      <noscript>JavaScript is required to use CardNurture.</noscript>
    </main>
  </body>
</html>
